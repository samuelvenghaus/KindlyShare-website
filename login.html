<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — KindlyShare™</title>
<meta name="description" content="Log in op je KindlyShare™-account om verder te gaan.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-page">
  <div class="login-glow top" aria-hidden="true"></div>
  <div class="login-glow bottom" aria-hidden="true"></div>

  <div class="login-card">
    <a href="index.html" class="login-logo">
      <img src="assets/logo.png" alt="KindlyShare™">
    </a>

    <h1>Welkom terug</h1>
    <p class="login-sub">Log in op je account om verder te gaan.</p>

    <form class="login-form">
      <div class="login-field">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="email" name="email" placeholder="E-mailadres" autocomplete="email" required>
      </div>

      <div class="login-field">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4" stroke-linecap="round"/></svg>
        <input id="login-password" type="password" name="password" placeholder="Wachtwoord" autocomplete="current-password" required style="padding-right:46px;">
        <button type="button" class="toggle-visibility" aria-label="Wachtwoord tonen of verbergen">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 5.1A10.9 10.9 0 0112 5c7 0 10.5 7 10.5 7a17.6 17.6 0 01-3.2 4.1M6.6 6.6C3.4 8.6 1.5 12 1.5 12S5 19 12 19c1.4 0 2.6-.3 3.7-.7M9.9 9.9a3 3 0 004.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="login-options">
        <label class="login-remember">
          <input type="checkbox" name="remember">
          Onthoud mij
        </label>
        <a href="#">Wachtwoord vergeten?</a>
      </div>

      <button type="submit" class="btn btn-accent login-submit">
        Inloggen
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="login-divider">Of log in met</div>

    <div class="login-sso-grid">
      <a href="#" class="login-sso-btn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.2-2.2H12v4.2h6.5c-.1 1.1-.9 2.7-2.6 3.8l-.02.16 3.77 2.92.26.03c2.4-2.2 3.79-5.5 3.79-8.9z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.78-2.94c-1.02.71-2.4 1.2-4.16 1.2-3.18 0-5.88-2.1-6.84-5.02l-.14.01-3.92 3.04-.05.14C3.02 21.3 7.19 24 12 24z"/><path fill="#FBBC05" d="M5.16 14.34A7.4 7.4 0 014.76 12c0-.81.14-1.6.38-2.34l-.01-.16-3.97-3.09-.13.06A12 12 0 000 12c0 1.93.47 3.76 1.29 5.36l3.87-3.02z"/><path fill="#EA4335" d="M12 4.75c2.26 0 3.79.98 4.66 1.8l3.4-3.32C17.94 1.19 15.24 0 12 0 7.19 0 3.02 2.7 1.02 6.64l3.98 3.09c.98-2.92 3.68-5 6.99-5z"/></svg>
        Doorgaan met Google
      </a>
      <a href="#" class="login-sso-btn">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" fill="#F35325"/><rect x="13" y="2" width="9" height="9" fill="#81BC06"/><rect x="2" y="13" width="9" height="9" fill="#05A6F0"/><rect x="13" y="13" width="9" height="9" fill="#FFBA08"/></svg>
        Doorgaan met Microsoft
      </a>
    </div>

    <p class="login-footer-text">
      Nog geen account? <a href="#">Maak er nu een aan</a> of <a href="#">plan een demo</a>.
    </p>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
